<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program Pesona BPG, KPM</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter dan Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,300&display=swap" rel="stylesheet">
  <!-- Supabase JS Client CDN -->
  
  <script>
    // URL GOOGLE APPS SCRIPT RASMI (TERBINA DALAM)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6rQutIN4-Aqjz-bgDbJUpSTnB575cfshNnJPDoxXBusjgGiEJHh8WWhvqRWJ6pFmoyg/exec";

    // 10 OFFICIAL QUESTIONS
    const QUIZ_QUESTIONS = [
      {
        no: 1,
        slot: 'Slot 1',
        topic: 'Perbezaan Coaching vs Mentoring',
        q: 'Apakah perbezaan paling ketara antara peranan seorang jurupandu citra (coach) dan seorang mentor?',
        options: [
          { key: 'A', text: 'Coach memberi tunjuk ajar teknikal secara langsung, manakala mentor hanya mendengar tanpa memberi panduan.' },
          { key: 'B', text: 'Coach membantu mencungkil potensi dan penyelesaian kendiri melalui soalan reflektif, manakala mentor berkongsi pengalaman, kebijaksanaan, dan kepakaran secara berstruktur.' },
          { key: 'C', text: 'Coach bertindak menguruskan tindakan tatatertib staf, manakala mentor menguruskan kenaikan pangkat.' },
          { key: 'D', text: 'Coach menumpukan kepada pembinaan sahsiah peribadi semata-mata, manakala mentor hanya melihat kepada hasil kerja pentadbiran.' }
        ],
        ans: 'B'
      },
      {
        no: 2,
        slot: 'Slot 1',
        topic: 'Anjakan Pemimpin Pembimbing',
        q: 'Apakah anjakan paradigma utama yang perlu dimiliki oleh pegawai yang berperanan sebagai "Pemimpin Pembimbing" (Leader-as-Coach)?',
        options: [
          { key: 'A', text: 'Berubah daripada pendekatan mengarah (directing) dan memberitahu kepada pendekatan mengupayakan (empowering) staf berfikir secara kritis.' },
          { key: 'B', text: 'Mengambil alih semua tugas yang gagal dilaksanakan oleh staf bawahan demi menjaga standard kualiti.' },
          { key: 'C', text: 'Mengurangkan kekerapan berkomunikasi bagi mengelakkan konflik di tempat kerja.' },
          { key: 'D', text: 'Memberikan arahan tegas tanpa perlu mendengar maklum balas daripada staf.' }
        ],
        ans: 'A'
      },
      {
        no: 3,
        slot: 'Slot 1',
        topic: 'Kemahiran Mendengar Aras 3 (Global)',
        q: 'Dalam konteks komunikasi bimbingan, kemahiran Mendengar Aras 3 (Global/Intuitive Listening) dicirikan oleh tindakan yang mana?',
        options: [
          { key: 'A', text: 'Menumpukan perhatian penuh bukan sahaja kepada butiran perkataan, tetapi juga bahasa badan, intonasi emosi, dan mesej tersirat di sebalik percakapan.' },
          { key: 'B', text: 'Menghafal dan mencatat setiap perkataan yang diluahkan tanpa perlu memandang mata pihak yang dibimbing.' },
          { key: 'C', text: 'Merangka ayat jawapan balas dengan cepat semasa rakan bimbingan sedang meluahkan pandangan.' },
          { key: 'D', text: 'Memintas percakapan rakan bimbingan untuk terus menawarkan jalan penyelesaian yang pantas.' }
        ],
        ans: 'A'
      },
      {
        no: 4,
        slot: 'Slot 2',
        topic: 'Fasa "Goal" Model GROW',
        q: 'Dalam kerangka Model GROW, apakah fokus utama seorang pembimbing pada fasa pertama iaitu "Goal" (Matlamat)?',
        options: [
          { key: 'A', text: 'Meneroka kegagalan lalu dan mencari punca kesilapan staf.' },
          { key: 'B', text: 'Menetapkan hasil dan objektif yang jelas, spesifik, dan dipersetujui bersama bagi sesi bimbingan tersebut.' },
          { key: 'C', text: 'Memberikan senarai tugas yang perlu disiapkan oleh staf dalam masa terdekat.' },
          { key: 'D', text: 'Membina jadual pemantauan tugas secara terperinci.' }
        ],
        ans: 'B'
      },
      {
        no: 5,
        slot: 'Slot 2',
        topic: 'Fasa "Reality" Model GROW',
        q: 'Semasa fasa "Reality" dalam Model GROW, pembimbing wajar bersikap bagaimana terhadap situasi yang diceritakan oleh staf?',
        options: [
          { key: 'A', text: 'Bersikap menghakimi dan segera menegur kesilapan yang dilakukan oleh staf.' },
          { key: 'B', text: 'Menolak maklumat yang diberikan jika tidak menyebelahi pendapat pembimbing.' },
          { key: 'C', text: 'Meneroka fakta, kekangan, dan kedudukan semasa secara objektif tanpa bersikap menyalahkan atau defensif.' },
          { key: 'D', text: 'Mengalihkan perbualan kepada pencapaian cemerlang pegawai lain di bahagian tersebut.' }
        ],
        ans: 'C'
      },
      {
        no: 6,
        slot: 'Slot 2',
        topic: 'Penyoalan Berkuasa (Fasa Options)',
        q: 'Antara berikut, yang manakah contoh "Soalan Berkuasa" (Powerful Questioning) yang paling berkesan untuk menjana fasa "Options" (Pilihan)?',
        options: [
          { key: 'A', text: '"Mengapa anda lambat bertindak sehingga perkara ini menjadi masalah besar?"' },
          { key: 'B', text: '"Apakah 2 atau 3 alternatif berbeza yang boleh anda pertimbangkan untuk mengatasi kekangan ini?"' },
          { key: 'C', text: '"Adakah anda setuju sahaja sekiranya kita guna cadangan yang saya sebutkan tadi?"' },
          { key: 'D', text: '"Bolehkah anda pastikan masalah ini tidak berulang lagi pada minggu hadapan?"' }
        ],
        ans: 'B'
      },
      {
        no: 7,
        slot: 'Slot 2',
        topic: 'Teknik Maklum Balas Konstruktif',
        q: 'Apakah teknik maklum balas (feedback) yang paling membina semasa mengendalikan bimbingan profesional?',
        options: [
          { key: 'A', text: 'Memberikan maklum balas berasaskan tingkah laku yang diperhati secara spesifik dan objektif, bukan menyerang keperibadian individu.' },
          { key: 'B', text: 'Menyatakan kelemahan staf secara umum agar mereka boleh mentafsir sendiri kesilapan tersebut.' },
          { key: 'C', text: 'Mengelakkan pemberian sebarang maklum balas negatif bagi menjaga hati rakan sekerja.' },
          { key: 'D', text: 'Memberikan teguran secara terbuka di hadapan semua kakitangan lain untuk memberi pengajaran.' }
        ],
        ans: 'A'
      },
      {
        no: 8,
        slot: 'Slot 3',
        topic: 'Fasa "Will / Way Forward"',
        q: 'Dalam Model GROW, fasa terakhir iaitu "Will" atau "Way Forward" memberi penekanan kepada:',
        options: [
          { key: 'A', text: 'Memastikan staf akur dengan arahan pentadbiran tanpa sebarang persoalan.' },
          { key: 'B', text: 'Membina komitmen dan persetujuan staf terhadap tindakan spesifik, sumber sokongan yang diperlukan, serta garis masa pelaksanaan.' },
          { key: 'C', text: 'Mengulang semula perbincangan tentang kegagalan masa lalu yang pernah berlaku.' },
          { key: 'D', text: 'Menyemak semula objektif asal organisasi tanpa menetapkan pelan individu.' }
        ],
        ans: 'B'
      },
      {
        no: 9,
        slot: 'Slot 3',
        topic: 'Ciri Pelan Tindakan Berkesan',
        q: 'Apakah ciri utama Pelan Tindakan Bimbingan Profesional (Action Plan) yang berkesan di tempat kerja?',
        options: [
          { key: 'A', text: 'Bersifat umum dan fleksibel sehingga tidak memerlukan tarikh siap yang pasti.' },
          { key: 'B', text: 'Mempunyai langkah kerja yang jelas, kriteria kejayaan yang boleh diukur, serta persetujuan jadual pemantauan berkala.' },
          { key: 'C', text: 'Disediakan sepenuhnya oleh pembimbing tanpa melibatkan pandangan staf yang dibimbing.' },
          { key: 'D', text: 'Hanya didokumentasikan di atas kertas tanpa perlu ada sesi semakan susulan.' }
        ],
        ans: 'B'
      },
      {
        no: 10,
        slot: 'Slot 3',
        topic: 'Mekanisme Susulan dan Akauntabiliti',
        q: 'Selepas sesuatu sesi bimbingan tamat, apakah peranan utama seorang pembimbing bagi memastikan pelan tindakan benar-benar diterjemahkan kepada hasil kerja?',
        options: [
          { key: 'A', text: 'Menyerahkan sepenuhnya kepada staf dan tidak perlu lagi bertanya tentang perkembangan tugasan tersebut.' },
          { key: 'B', text: 'Mengadakan semakan susulan berkala berasaskan jadual yang dipersetujui bagi menyokong kemajuan dan akauntabiliti staf.' },
          { key: 'C', text: 'Menukar pelan tindakan kepada bentuk arahan bertulis yang ketat sekiranya staf menghadapi sebarang halangan awal.' },
          { key: 'D', text: 'Menutup fail bimbingan secara kekal sebaik sahaja perbincangan pertama selesai.' }
        ],
        ans: 'B'
      }
    ];

    // LOCAL STORAGE CACHE
    function getLocalSubmissions() {
      const data = localStorage.getItem('bpg_local_submissions');
      return data ? JSON.parse(data) : [];
    }

    function saveLocalSubmission(sub) {
      const list = getLocalSubmissions();
      list.push(sub);
      localStorage.setItem('bpg_local_submissions', JSON.stringify(list));
    }

    // RENDER QUESTIONS IN FORMS
    function renderQuizzes() {
      ['pra', 'pasca'].forEach(type => {
        const container = document.getElementById(`quiz-container-${type}`);
        if (!container) return;
        container.innerHTML = '';
        QUIZ_QUESTIONS.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'p-5 bg-slate-50 rounded-xl border border-slate-200';
          card.innerHTML = `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold text-slate-400">SOALAN ${item.no} DARI 10</span>
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-200 text-slate-700">${item.slot}</span>
            </div>
            <p class="font-semibold text-slate-800 text-sm mb-3">${item.q}</p>
            <div class="space-y-2">
              ${item.options.map(opt => `
                <label class="flex items-start space-x-3 p-3 bg-white rounded-lg border border-slate-200 hover:border-bpg-blue cursor-pointer transition text-xs sm:text-sm">
                  <input type="radio" name="${type}_q${item.no}" value="${opt.key}" required class="mt-0.5 text-bpg-blue focus:ring-bpg-blue">
                  <span class="text-slate-700"><strong class="text-slate-900">${opt.key}.</strong> ${opt.text}</span>
                </label>
              `).join('')}
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    // SUBMIT QUIZ TO GOOGLE APPS SCRIPT + LOCAL CACHE
    async function submitQuiz(e, testType) {
      e.preventDefault();
      const prefix = testType.toLowerCase() === 'pre' ? 'pra' : 'pasca';
      const form = document.getElementById(`form-${prefix}`);
      const btn = document.getElementById(`btn-submit-${prefix}`);

      btn.disabled = true;
      btn.textContent = 'Menghantar ke Google Sheets...';

      let score = 0;
      const row = {
        jenis_ujian: testType,
        created_at: new Date().toISOString()
      };

      QUIZ_QUESTIONS.forEach(item => {
        const selected = form.querySelector(`input[name="${prefix}_q${item.no}"]:checked`);
        const isCorrect = (selected && selected.value === item.ans) ? 1 : 0;
        if (isCorrect) score++;
        row[`q${item.no}`] = isCorrect;
      });
      row.skor_total = score;

      // 1. Simpan salinan ke dalam simpanan tempatan (LocalStorage)
      saveLocalSubmission(row);

      // 2. Hantar terus ke Google Apps Script (Google Sheets)
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(row)
        });
        console.log("Data kuiz berjaya dipindahkan ke Google Sheets.");
      } catch (err) {
        console.warn("Ralat rangkaian ketika menghantar ke Google Script:", err);
      }

      // 3. Kemas kini Paparan Antara Muka (UI)
      form.classList.add('hidden');
      const resBox = document.getElementById(`result-box-${prefix}`);
      const scoreDisp = document.getElementById(`score-display-${prefix}`);
      if (scoreDisp) scoreDisp.textContent = `${score} / 10`;
      if (resBox) resBox.classList.remove('hidden');

      // Muat semula analisis data terkumpul
      calculateAggregates();
    }

    // CALCULATE AGGREGATES DARI GOOGLE SHEETS / LOCAL STORAGE
    async function calculateAggregates() {
      let data = [];

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        if (response.ok) {
          const gsData = await response.json();
          if (Array.isArray(gsData) && gsData.length > 0) {
            data = gsData;
          }
        }
      } catch (err) {
        console.log("Menggunakan data cache tempatan sementara:", err);
      }

      // Jika data dari Google Sheets belum tiba atau kosong, gunakan data tempatan
      if (data.length === 0) {
        data = getLocalSubmissions();
      }

      const preList = data.filter(d => (d.jenis_ujian || d.Jenis_Ujian) === 'PRE');
      const postList = data.filter(d => (d.jenis_ujian || d.Jenis_Ujian) === 'POST');

      const preCount = preList.length;
      const postCount = postList.length;

      const elPreCount = document.getElementById('stat-count-pre');
      const elPostCount = document.getElementById('stat-count-post');
      if (elPreCount) elPreCount.textContent = preCount;
      if (elPostCount) elPostCount.textContent = postCount;

      const preAvg = preCount > 0 ? (preList.reduce((acc, c) => acc + Number(c.skor_total || c.Skor_Total || 0), 0) / preCount) : 0;
      const postAvg = postCount > 0 ? (postList.reduce((acc, c) => acc + Number(c.skor_total || c.Skor_Total || 0), 0) / postCount) : 0;

      const elPreAvg = document.getElementById('stat-avg-pre');
      const elPrePct = document.getElementById('stat-pct-pre');
      if (elPreAvg) elPreAvg.textContent = preAvg.toFixed(1);
      if (elPrePct) elPrePct.textContent = `${(preAvg * 10).toFixed(0)}% ketepatan asas`;

      const elPostAvg = document.getElementById('stat-avg-post');
      const elPostPct = document.getElementById('stat-pct-post');
      if (elPostAvg) elPostAvg.textContent = postAvg.toFixed(1);
      if (elPostPct) elPostPct.textContent = `${(postAvg * 10).toFixed(0)}% ketepatan akhir`;

      const diff = postAvg - preAvg;
      const diffEl = document.getElementById('stat-diff-score');
      if (diffEl) {
        diffEl.textContent = (diff >= 0 ? `+${diff.toFixed(1)}` : diff.toFixed(1));
        diffEl.className = diff >= 0 ? 'text-3xl font-extrabold text-emerald-600' : 'text-3xl font-extrabold text-red-600';
      }

      const pctDiff = preAvg > 0 ? (((postAvg - preAvg) / preAvg) * 100).toFixed(1) : 0;
      const elDiffPct = document.getElementById('stat-diff-percent');
      if (elDiffPct) {
        elDiffPct.textContent = (diff >= 0 ? `+${pctDiff}%` : `${pctDiff}%`) + ' perbezaan purata';
      }

      // Render Item-by-item Table
      const tbody = document.getElementById('breakdown-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';

      QUIZ_QUESTIONS.forEach(item => {
        const qKeyLower = `q${item.no}`;
        const qKeyUpper = `Q${item.no}`;
        
        const preCorrect = preCount > 0 ? preList.filter(d => Number(d[qKeyLower] !== undefined ? d[qKeyLower] : d[qKeyUpper]) === 1).length : 0;
        const postCorrect = postCount > 0 ? postList.filter(d => Number(d[qKeyLower] !== undefined ? d[qKeyLower] : d[qKeyUpper]) === 1).length : 0;

        const prePct = preCount > 0 ? ((preCorrect / preCount) * 100) : 0;
        const postPct = postCount > 0 ? ((postCorrect / postCount) * 100) : 0;
        const itemDiff = postPct - prePct;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';

        let badge = '';
        if (itemDiff > 0) {
          badge = `<span class="inline-flex items-center text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-full">+${itemDiff.toFixed(1)}%</span>`;
        } else if (itemDiff < 0) {
          badge = `<span class="inline-flex items-center text-xs font-bold text-red-700 bg-red-100 px-2.5 py-1 rounded-full">${itemDiff.toFixed(1)}%</span>`;
        } else {
          badge = `<span class="inline-flex items-center text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">0.0%</span>`;
        }

        tr.innerHTML = `
          <td class="p-4 text-center font-bold text-slate-400">${item.no}</td>
          <td class="p-4">
            <span class="font-bold text-slate-800 block text-xs sm:text-sm">${item.topic}</span>
            <span class="text-xs text-slate-500 line-clamp-1">${item.q}</span>
          </td>
          <td class="p-4 text-center text-xs font-semibold text-slate-600">${item.slot}</td>
          <td class="p-4 text-center font-semibold text-slate-700">${prePct.toFixed(0)}% <span class="text-[10px] text-slate-400 block">(${preCorrect}/${preCount})</span></td>
          <td class="p-4 text-center font-bold text-emerald-700">${postPct.toFixed(0)}% <span class="text-[10px] text-slate-400 block">(${postCorrect}/${postCount})</span></td>
          <td class="p-4 text-center">${badge}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // TAB SWITCHING
    function switchTab(tabId) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-tab').forEach(el => {
        el.classList.remove('bg-white/20', 'shadow');
        el.classList.add('hover:bg-white/10', 'text-white/80');
      });

      const activeView = document.getElementById(`view-${tabId}`);
      if (activeView) activeView.classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white/20', 'shadow');
        activeBtn.classList.remove('hover:bg-white/10', 'text-white/80');
      }

      if (tabId === 'analisis') {
        calculateAggregates();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // READING SLOT SWITCHING
    function showSlot(slotId) {
      document.querySelectorAll('.slot-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.slot-btn').forEach(el => {
        el.classList.remove('bg-bpg-navy', 'text-white', 'shadow');
        el.classList.add('hover:bg-slate-100', 'text-slate-700');
      });

      const content = document.getElementById(`content-${slotId}`);
      if (content) content.classList.remove('hidden');
      const activeBtn = document.getElementById(`btn-${slotId}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-bpg-navy', 'text-white', 'shadow');
        activeBtn.classList.remove('hover:bg-slate-100', 'text-slate-700');
      }
    }

    function refreshData() {
      calculateAggregates();
    }

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      renderQuizzes();
      calculateAggregates();
    });

  </script>
</body>
</html>
